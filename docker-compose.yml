services:
  lexbot:
    image: ghcr.io/ryanmiura/lexbot:latest
    container_name: lexbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/session.db
    volumes:
      - ./lexbot-data:/app/data

  lexbot-api:
    image: ghcr.io/ryanmiura/lexbot-api:latest
    container_name: lexbot-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/session.db
    volumes:
      - ./lexbot-data:/app/data
    ports:
      # Loopback-only host binding, kept for local debugging
      # (curl http://127.0.0.1:8081 from the VPS itself). NPM does NOT use
      # this — NPM runs as its own container on its own bridge network
      # (gestao_default), so "127.0.0.1" from inside NPM's container is
      # NPM's own loopback, not the host's. NPM reaches this service via
      # the shared gestao_default network below instead, targeting it by
      # container name (http://lexbot-api:8081), same as any other
      # container-to-container proxy target in Docker Compose.
      - "127.0.0.1:8081:8081"
    networks:
      - default
      - gestao_default

networks:
  gestao_default:
    external: true
